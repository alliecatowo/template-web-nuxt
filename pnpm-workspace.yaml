# pnpm skips dependency install scripts unless listed here.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  # Pulled in by firebase-tools; their install scripts are not needed.
  protobufjs: false
  re2: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.12'
  - eslint@10.12.0
  - vue-tsc@3.3.12
